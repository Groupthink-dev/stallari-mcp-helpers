[project]
name = "stallari-mcp-helpers"
version = "0.4.0"
description = "Canonical helpers for Stallari-conformant MCP servers — `_meta` audit envelope builder and per-record domain-hint pattern engine. Drop-in primitives for Python MCP authors targeting Stallari's contract surface (DD-333/DD-338)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Piers Dawson-Damer" }]
keywords = ["stallari", "mcp", "helpers", "audit-envelope", "domain-hint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Groupthink-dev/stallari-mcp-helpers"
Repository = "https://github.com/Groupthink-dev/stallari-mcp-helpers"
Issues = "https://github.com/Groupthink-dev/stallari-mcp-helpers/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
stallari-mcp-lint = "stallari_mcp_helpers.lint:_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stallari_mcp_helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
